<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Newsroom — Wphotographs</title>
  <meta name="description" content="Photo releases, release notes and project news from Wphotographs.">
  <meta name="theme-color" content="#ebe8e1">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pages.css">
  <script>try{var d=JSON.parse(sessionStorage.getItem('wp-curtain')||'null');if(d&&!d.silent)document.documentElement.classList.add('is-entering');}catch(e){}</script>
  <script src="vendor/gsap.min.js" defer></script>
  <script src="vendor/ScrollTrigger.min.js" defer></script>
  <script src="vendor/lenis.min.js" defer></script>
  <script type="module" src="js/news.js"></script>
</head>
<body class="pg pg--news">
  <main class="page">
    <section class="nw-hero" aria-labelledby="nw-title">
      <p class="pg-kicker" data-reveal>Newsroom · Release notes</p>
      <h1 class="nw-title" id="nw-title">Updates worth noticing.</h1>
      <p class="pg-body nw-lede" data-reveal>New photo releases, site changes and useful feature notes. Smaller updates will not appear on this page.</p>
      <div class="nw-filter" role="tablist" aria-label="Filter updates">
        <button type="button" role="tab" aria-selected="true" data-filter="all">All <sup></sup></button>
        <button type="button" role="tab" aria-selected="false" data-filter="content">Photos <sup></sup></button>
        <button type="button" role="tab" aria-selected="false" data-filter="release">Release notes <sup></sup></button>
        <button type="button" role="tab" aria-selected="false" data-filter="project">Projects <sup></sup></button>
      </div>
    </section>
    <section class="nw-list" aria-label="Updates"></section>
  </main>
</body>
</html>
