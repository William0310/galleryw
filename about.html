<body class="pg pg--about">

      <p class="ab-manifesto__big" data-text="manifesto"></p>
      <p class="ab-manifesto__sub" data-reveal data-text="manifestoSub"></p>
    </section>

      </div>

        <input type="hidden" name="_subject" value="New message from Wphotographs">
        <input class="form__trap" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
        <label class="field"><span>Name *</span><input type="text" name="name" autocomplete="name" maxlength="80" required></label>
        <label class="field"><span>Contact info *</span><input type="text" name="contact_info" autocomplete="email" maxlength="160" placeholder="Email, social handle, or phone" required></label>
        <label class="field field--area"><span>Notes *</span><textarea name="notes" rows="6" minlength="10" maxlength="1600" required></textarea></label>
