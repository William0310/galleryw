<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Component 3 | William's Photo Gallery</title>
    <meta name="description" content="A seamless horizontal image track with free panning and slow infinite auto-scroll.">
    <link rel="preload" as="image" href="images/jpg-1_01.jpg" type="image/jpeg" fetchpriority="high">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <style>
        :root {
            color-scheme: dark;
            --paper: #f4eee3;
            --muted: rgba(244, 238, 227, 0.64);
            --line: rgba(244, 238, 227, 0.16);
            --hud: rgba(0, 0, 0, 0.34);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        body {
            color: var(--paper);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        a {
            color: inherit;
        }

        img {
            display: block;
            max-width: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        button {
            font: inherit;
        }

        .cop3-hud {
            position: fixed;
            top: 16px;
            left: 16px;
            right: 16px;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            pointer-events: none;
        }

        .cop3-back,
        .cop3-title {
            pointer-events: auto;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: var(--hud);
            color: rgba(244, 238, 227, 0.82);
            box-shadow: 0 16px 38px rgba(0, 0, 0, 0.34), 0 1px 0 rgba(255, 255, 255, 0.08) inset;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .cop3-back {
            display: inline-flex;
            align-items: center;
            min-height: 36px;
            padding: 0 13px;
            font-size: 0.82rem;
            font-weight: 760;
            text-decoration: none;
            transition: border-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
        }

        .cop3-back::before {
            content: "";
            display: inline-block;
            width: 0.58em;
            height: 0.58em;
            margin-right: 8px;
            border-left: 1.5px solid currentColor;
            border-bottom: 1.5px solid currentColor;
            transform: rotate(45deg);
        }

        .cop3-back:hover,
        .cop3-back:focus-visible {
            border-color: rgba(244, 238, 227, 0.34);
            color: #fff;
            transform: translateY(-1px);
        }

        .cop3-title {
            display: grid;
            gap: 1px;
            min-width: 112px;
            padding: 8px 13px;
            text-align: right;
        }

        .cop3-title span {
            color: var(--muted);
            font-size: 0.64rem;
            font-weight: 800;
            letter-spacing: 0;
            text-transform: uppercase;
        }

        .cop3-title strong {
            color: rgba(244, 238, 227, 0.92);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.12rem;
            font-weight: 500;
            line-height: 1;
        }

        .cop3-stage {
            width: 100vw;
            height: 100svh;
            overflow-x: auto;
            overflow-y: hidden;
            background: #000;
            overscroll-behavior: none;
            scrollbar-width: none;
            touch-action: pan-x;
        }

        .cop3-stage::-webkit-scrollbar {
            display: none;
        }

        .cop3-track {
            display: flex;
            align-items: center;
            width: max-content;
            height: 100%;
        }

        .cop3-strip {
            display: flex;
            flex: 0 0 auto;
            align-items: center;
            gap: 0;
            margin: 0;
            padding: 0;
        }

        .cop3-frame {
            flex: 0 0 auto;
            display: block;
            width: auto;
            height: 70svh;
            margin: 0;
            padding: 0;
            border: 0;
            appearance: none;
            -webkit-appearance: none;
            background: transparent;
            color: inherit;
            cursor: pointer;
        }

        .cop3-frame:focus-visible {
            position: relative;
            z-index: 2;
            outline: 2px solid rgba(244, 238, 227, 0.8);
            outline-offset: -2px;
        }

        .cop3-frame img {
            flex: 0 0 auto;
            width: auto;
            height: 100%;
            object-fit: contain;
            object-position: top left;
        }

        .cop3-vignette {
            position: fixed;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            background:
                linear-gradient(90deg, rgba(0, 0, 0, 0.48), transparent 12%, transparent 88%, rgba(0, 0, 0, 0.48)),
                linear-gradient(180deg, rgba(0, 0, 0, 0.44), transparent 18%, transparent 82%, rgba(0, 0, 0, 0.44));
        }

        .cop3-edge-mask {
            position: fixed;
            top: 0;
            bottom: 0;
            z-index: 11;
            width: min(18vw, 220px);
            pointer-events: none;
        }

        .cop3-edge-mask--left {
            left: 0;
            background: linear-gradient(90deg, #000 0%, rgba(0, 0, 0, 0.72) 42%, transparent 100%);
        }

        .cop3-edge-mask--right {
            right: 0;
            background: linear-gradient(270deg, #000 0%, rgba(0, 0, 0, 0.72) 42%, transparent 100%);
        }

        .cop3-modal {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: grid;
            place-items: center;
            padding: clamp(18px, 5vw, 54px);
            background: rgba(0, 0, 0, 0.74);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .cop3-modal.is-open {
            opacity: 1;
            pointer-events: auto;
        }

        .cop3-dialog {
            position: relative;
            width: min(760px, 100%);
            min-height: min(460px, calc(100svh - 44px));
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(16, 14, 10, 0.94);
            box-shadow: 0 34px 90px rgba(0, 0, 0, 0.58), 0 1px 0 rgba(255, 255, 255, 0.08) inset;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            transform: translateY(8px) scale(0.98);
            transition: transform 0.2s ease;
        }

        .cop3-modal.is-open .cop3-dialog {
            transform: translateY(0) scale(1);
        }

        .cop3-dialog__top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            padding: 26px 78px 0 30px;
        }

        .cop3-dialog__label {
            margin: 0;
            color: var(--muted);
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 0;
            text-transform: uppercase;
        }

        .cop3-dialog__close {
            position: absolute;
            top: 18px;
            right: 18px;
            display: inline-grid;
            place-items: center;
            width: 44px;
            height: 44px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: rgba(244, 238, 227, 0.06);
            color: rgba(244, 238, 227, 0.86);
            cursor: pointer;
            font-size: 1.65rem;
            font-weight: 400;
            line-height: 1;
            transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease, transform 0.2s ease;
        }

        .cop3-dialog__close:hover,
        .cop3-dialog__close:focus-visible {
            border-color: rgba(244, 238, 227, 0.34);
            background: rgba(244, 238, 227, 0.12);
            color: #fff;
            transform: translateY(-1px);
        }

        .cop3-dialog__body {
            display: grid;
            align-content: center;
            gap: 18px;
            min-height: 330px;
            padding: 22px 30px 34px;
        }

        .cop3-dialog__body h2 {
            margin: 0;
            color: var(--paper);
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(2.1rem, 5vw, 3.6rem);
            font-weight: 500;
            line-height: 1.05;
        }

        .cop3-dialog__body p {
            margin: 0;
            color: rgba(244, 238, 227, 0.72);
            font-size: clamp(1rem, 2vw, 1.18rem);
            line-height: 1.6;
        }

        @media (max-width: 700px) {
            .cop3-hud {
                top: 12px;
                left: 12px;
                right: 12px;
            }

            .cop3-title {
                min-width: 0;
                padding: 7px 10px;
            }

            .cop3-title span {
                display: none;
            }

            .cop3-edge-mask {
                width: 80px;
            }

            .cop3-dialog__body h2 {
                font-size: 1.55rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .cop3-stage {
                scroll-behavior: auto;
            }
        }
    </style>
</head>
<body>
    <header class="cop3-hud" aria-label="Page controls">
        <a class="cop3-back" href="archive.html">More Photos</a>
        <div class="cop3-title">
            <span>Connections</span>
            <strong>Component 3</strong>
        </div>
    </header>

    <main class="cop3-stage" aria-label="Cop 3 infinite horizontal image track" data-stage>
        <div class="cop3-track" data-track>
            <figure class="cop3-strip" data-strip>
                <button class="cop3-frame" type="button" data-title="Plate 01: Mountain Threshold" data-copy="A misty landscape opening for the Journey to the West sequence. The vertical composition sets a mythic road before the figures enter the story.">
                    <img src="images/jpg-1_01.jpg" alt="Plate 01, misty mountain landscape from the Journey to the West visual sequence" width="750" height="1772" decoding="async">
                </button>
                <button class="cop3-frame" type="button" data-title="Plate 02: Stone and Trace" data-copy="A textured fragment that shifts the series from scenery into artifact. The marks feel like evidence from an older mythic world.">
                    <img src="images/jpg-1_02.jpg" alt="Plate 02, textured myth fragment with stone-like surface" width="750" height="1772" decoding="async">
                </button>
                <button class="cop3-frame" type="button" data-title="Plate 03: Character Echo" data-copy="This frame focuses on character memory rather than a full scene, showing how a single figure can carry a larger myth around it.">
                    <img src="images/jpg-1_03.jpg" alt="Plate 03, character-focused myth artwork detail" width="750" height="1772" decoding="async">
                </button>
                <button class="cop3-frame" type="button" data-title="Plate 04: Painted Passage" data-copy="A transition plate for movement through the story. It works like a visual pause between landscape, figure, and symbol.">
                    <img src="images/jpg-1_04.jpg" alt="Plate 04, vertical painted passage from the myth sequence" width="750" height="1772" decoding="async">
                </button>
                <button class="cop3-frame" type="button" data-title="Plate 05: Guardian Figure" data-copy="A portrait-like detail that suggests authority, ritual, and the supernatural figures surrounding the Journey to the West tradition.">
                    <img src="images/jpg-1_05.jpg" alt="Plate 05, guardian-like figure in vertical myth artwork" width="750" height="1772" decoding="async">
                </button>
                <button class="cop3-frame" type="button" data-title="Plate 06: Mythic Link" data-copy="This image points to the connections between Journey to the West and wider Chinese myth, where characters and symbols cross story boundaries.">
                    <img src="images/jpg-1_06.jpg" alt="Plate 06, mythic figure and symbolic detail" width="750" height="1772" decoding="async">
                </button>
                <button class="cop3-frame" type="button" data-title="Plate 07: Moving Company" data-copy="A composition about travel, companions, and the repeated forward motion that gives the classic story its structure.">
                    <img src="images/jpg-1_07.jpg" alt="Plate 07, Journey to the West travel scene detail" width="750" height="1772" decoding="async">
                </button>
                <button class="cop3-frame" type="button" data-title="Plate 08: Ritual Surface" data-copy="A close visual surface for atmosphere and material detail. It gives the horizontal track a slower, more archaeological rhythm.">
                    <img src="images/jpg-1_08.jpg" alt="Plate 08, ritual-like surface detail from myth artwork" width="750" height="1772" decoding="async">
                </button>
                <button class="cop3-frame" type="button" data-title="Plate 09: Connected Myths" data-copy="A panel for the project theme of connection: characters, gods, monsters, and stories that overlap beyond one single version of the tale.">
                    <img src="images/jpg-1_09.jpg" alt="Plate 09, connected myth artwork detail" width="750" height="1772" decoding="async">
                </button>
                <button class="cop3-frame" type="button" data-title="Plate 10: Closing Fragment" data-copy="The final frame acts like an unresolved ending, keeping the track open so it can loop back into the beginning.">
                    <img src="images/jpg-1_10.jpg" alt="Plate 10, closing vertical fragment from the myth sequence" width="748" height="1772" decoding="async">
                </button>
            </figure>
        </div>
    </main>

    <div class="cop3-vignette" aria-hidden="true"></div>
    <div class="cop3-edge-mask cop3-edge-mask--left" aria-hidden="true"></div>
    <div class="cop3-edge-mask cop3-edge-mask--right" aria-hidden="true"></div>

    <div class="cop3-modal" data-modal aria-hidden="true">
        <section class="cop3-dialog" role="dialog" aria-modal="true" aria-labelledby="cop3-modal-title" aria-describedby="cop3-modal-copy">
            <div class="cop3-dialog__top">
                <p class="cop3-dialog__label" data-modal-label>Image note</p>
                <button class="cop3-dialog__close" type="button" aria-label="Close image note" data-modal-close>&times;</button>
            </div>
            <div class="cop3-dialog__body">
                <h2 id="cop3-modal-title" data-modal-title></h2>
                <p id="cop3-modal-copy" data-modal-copy></p>
            </div>
        </section>
    </div>

    <script>
        (() => {
            const stage = document.querySelector("[data-stage]");
            const track = document.querySelector("[data-track]");
            const sourceStrip = document.querySelector("[data-strip]");
            const modal = document.querySelector("[data-modal]");
            const modalTitle = document.querySelector("[data-modal-title]");
            const modalCopy = document.querySelector("[data-modal-copy]");
            const modalClose = document.querySelector("[data-modal-close]");
            const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

            if (!stage || !track || !sourceStrip || !modal || !modalTitle || !modalCopy || !modalClose) {
                return;
            }

            const copyCount = 3;
            const autoSpeed = 100;
            const idleDelay = 1100;
            let stripWidth = 0;
            let lastFrame = performance.now();
            let lastInteraction = performance.now();
            let autoRemainder = 0;

            for (let index = 1; index < copyCount; index += 1) {
                const clone = sourceStrip.cloneNode(true);
                clone.setAttribute("aria-hidden", "true");
                clone.removeAttribute("data-strip");
                clone.querySelectorAll("button").forEach((button) => {
                    button.tabIndex = -1;
                });
                track.appendChild(clone);
            }

            const openModal = (button) => {
                modalTitle.textContent = button.dataset.title || "Image note";
                modalCopy.textContent = button.dataset.copy || "";
                modal.classList.add("is-open");
                modal.setAttribute("aria-hidden", "false");
                stage.classList.add("is-modal-open");
                modalClose.focus();
                markInteraction();
            };

            const closeModal = () => {
                modal.classList.remove("is-open");
                modal.setAttribute("aria-hidden", "true");
                stage.classList.remove("is-modal-open");
                markInteraction();
            };

            const measure = () => {
                stripWidth = sourceStrip.getBoundingClientRect().width;

                if (stripWidth > 0) {
                    stage.scrollLeft = stripWidth + (stage.scrollLeft % stripWidth);
                    wrap();
                }
            };

            const wrap = () => {
                if (stripWidth <= 0) {
                    return;
                }

                if (stage.scrollLeft >= stripWidth * 2 - 1) {
                    stage.scrollLeft -= stripWidth;
                } else if (stage.scrollLeft <= stripWidth - 1) {
                    stage.scrollLeft += stripWidth;
                }
            };

            const markInteraction = () => {
                lastInteraction = performance.now();
                autoRemainder = 0;
            };

            const animate = (now) => {
                const delta = Math.min(1000, now - lastFrame);
                lastFrame = now;

                const shouldAutoScroll = !prefersReducedMotion.matches
                    && !modal.classList.contains("is-open")
                    && now - lastInteraction > idleDelay;

                if (shouldAutoScroll) {
                    autoRemainder += autoSpeed * (delta / 1000);

                    if (autoRemainder >= 1) {
                        const wholePixels = Math.floor(autoRemainder);

                        stage.scrollLeft += wholePixels;
                        autoRemainder -= wholePixels;
                        wrap();
                    }
                }

                requestAnimationFrame(animate);
            };

            const waitForImages = () => Promise.all(
                Array.from(sourceStrip.querySelectorAll("img")).map((image) => {
                    if (image.complete && image.naturalWidth > 0) {
                        return Promise.resolve();
                    }

                    return new Promise((resolve) => {
                        image.addEventListener("load", resolve, { once: true });
                        image.addEventListener("error", resolve, { once: true });
                    });
                })
            );

            stage.addEventListener("click", (event) => {
                if (!(event.target instanceof Element)) {
                    return;
                }

                const button = event.target.closest(".cop3-frame");

                if (!button || !stage.contains(button)) {
                    return;
                }

                openModal(button);
            });
            stage.addEventListener("wheel", (event) => {
                event.preventDefault();
                stage.scrollLeft += event.deltaX || event.deltaY;
                markInteraction();
                window.requestAnimationFrame(wrap);
            }, { passive: false });
            stage.addEventListener("scroll", wrap, { passive: true });
            window.addEventListener("resize", measure);
            modalClose.addEventListener("click", closeModal);
            modal.addEventListener("click", (event) => {
                if (event.target === modal) {
                    closeModal();
                }
            });
            document.addEventListener("keydown", (event) => {
                if (event.key === "Escape" && modal.classList.contains("is-open")) {
                    closeModal();
                }
            });

            waitForImages().then(() => {
                measure();
                stage.scrollLeft = stripWidth;
                requestAnimationFrame(animate);
            });
        })();
    </script>
</body>
</html>
