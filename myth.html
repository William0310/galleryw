<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myth | William's Photo Gallery</title>
    <meta name="description" content="A horizontal scroll image page for Myth.">
    <link rel="preload" as="image" href="images/myth.webp" type="image/webp" fetchpriority="high">
    <link rel="stylesheet" href="myth.css?v=1003">
    <link rel="icon" type="image/png" href="images/favicon.png">
</head>
<body>
    <header class="myth-hud" aria-label="Page controls">
        <a class="myth-back" href="index.html">Back</a>
        <div class="myth-title">
            <span>Horizontal scroll</span>
            <strong>Myth</strong>
        </div>
    </header>

    <main class="myth-scroll" aria-label="Myth horizontal image scroll">
        <figure class="myth-frame">
            <img src="images/myth.webp" alt="Ultra-wide Myth artwork" width="8268" height="1772" fetchpriority="high" decoding="async">
        </figure>
    </main>

    <div class="myth-progress" aria-hidden="true">
        <span data-progress></span>
    </div>

    <script>
        (() => {
            const scrollArea = document.querySelector(".myth-scroll");
            const progress = document.querySelector("[data-progress]");

            if (!scrollArea || !progress) {
                return;
            }

            const updateProgress = () => {
                const maxScroll = Math.max(1, scrollArea.scrollWidth - scrollArea.clientWidth);
                const ratio = Math.min(1, Math.max(0, scrollArea.scrollLeft / maxScroll));
                progress.style.transform = `scaleX(${ratio})`;
            };

            const wheelScrollSpeed = 2.5;
            const touchScrollSpeed = 1;
            let startY = 0;
            let startX = 0;
            let isSwipingHorizontal = null;

            scrollArea.addEventListener("wheel", (event) => {
                if (Math.abs(event.deltaX) > Math.abs(event.deltaY)) {
                    return;
                }

                if (event.deltaY !== 0) {
                    event.preventDefault();
                    scrollArea.scrollBy({
                        left: event.deltaY * wheelScrollSpeed,
                        behavior: "auto"
                    });
                }
            }, { passive: false });

            scrollArea.addEventListener("touchstart", (event) => {
                startY = event.touches[0].clientY;
                startX = event.touches[0].clientX;
                isSwipingHorizontal = null;
            }, { passive: false });

            scrollArea.addEventListener("touchmove", (event) => {
                const currentY = event.touches[0].clientY;
                const currentX = event.touches[0].clientX;
                const diffY = startY - currentY;
                const diffX = startX - currentX;

                if (isSwipingHorizontal === null) {
                    isSwipingHorizontal = Math.abs(diffX) > Math.abs(diffY);
                }

                if (isSwipingHorizontal) {
                    return;
                }

                event.preventDefault();
                scrollArea.scrollLeft += diffY * touchScrollSpeed;
                startY = currentY;
            }, { passive: false });

            scrollArea.addEventListener("scroll", updateProgress, { passive: true });
            window.addEventListener("resize", updateProgress);
            updateProgress();
        })();
    </script>
</body>
</html>
