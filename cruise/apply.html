<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cruise · Alpha Access</title>
<meta name="description" content="Apply for Cruise alpha access.">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/png" href="assets/icon-256.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css?v=13">
</head>
<body>

<header class="nav">
  <div class="wrap nav-in">
    <a class="brand" href="./" aria-label="Cruise">
      <img src="assets/icon-256.png" alt="" width="28" height="28">
      <span>Cruise</span>
    </a>
    <div class="nav-end">
      <button class="lang" id="lang" type="button" aria-label="Switch language">中文</button>
      <a class="btn btn-sm" href="./" data-i18n="m_back_btn">Back to Cruise</a>
    </div>
  </div>
</header>

<main>
<section class="apply">
  <div class="wrap apply-in">
    <h1 class="apply-h" data-i18n="ap_h">Cruise Alpha Tester Application</h1>
    <p class="apply-p" data-i18n="ap_p">Cruise is in alpha. Leave a way to reach you.</p>

    <form id="apply" class="form" action="https://formspree.io/f/mljjbqbw" method="POST" novalidate>
      <input type="hidden" name="_subject" value="Cruise alpha application">
      <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" class="hp" aria-hidden="true">

      <div class="field">
        <label for="contact" data-i18n="ap_email">Your Email / Contact Information</label>
        <input id="contact" name="contact" type="text" autocomplete="email" required placeholder="you@example.com, or another way to reach you" data-i18n-ph="ap_eph">
      </div>

      <label class="agree">
        <input type="checkbox" name="agreed" value="yes" required>
        <span data-i18n="ap_agree">I understand that Cruise is experimental alpha software, is not yet notarized by Apple, and may contain bugs. I agree to provide feedback if I encounter issues. Cruise itself contains no malicious code and does not collect your data, but I remain responsible for any risk of data or property loss from using it.</span>
      </label>

      <p class="err" id="err" role="alert" hidden></p>
      <button class="btn submit" id="send" type="submit" data-i18n="ap_send">Submit application</button>
    </form>

  </div>
</section>
</main>

<footer class="foot">
  <div class="wrap foot-in">
    <span>Created by William with love and patience, all rights reserved.</span>
    <span data-i18n="foot">Made with SwiftUI.</span>
  </div>
</footer>

<script src="js/main.js?v=13"></script>
<script>
(() => {
  const ENDPOINT = document.getElementById('apply').action;
  const $ = id => document.getElementById(id);
  const zh = () => document.documentElement.lang === 'zh-CN';
  const say = (en, cn) => { const e = $('err'); e.textContent = zh() ? cn : en; e.hidden = false; };
  $('apply').addEventListener('submit', async ev => {
    ev.preventDefault();
    $('err').hidden = true;
    const f = ev.target;
    if (!f.contact.value.trim()) return say('Please enter your email or contact information.', '请填写邮箱或联系方式。');
    if (!f.agreed.checked) return say('Please tick the box to confirm you understand.', '请勾选确认框。');
    if (ENDPOINT.includes('REPLACE_ME')) return say('This form is not connected yet.', '表单尚未连接。');
    const btn = $('send'); btn.disabled = true;
    try {
      const r = await fetch(ENDPOINT, { method: 'POST', body: new FormData(f), headers: { Accept: 'application/json' } });
      if (!r.ok) throw 0;
      location.href = 'download.html';
    } catch (e) {
      btn.disabled = false;
      say('Something went wrong. Please try again in a moment.', '出错了，请稍后再试。');
    }
  });
})();
</script>
</body>
</html>
